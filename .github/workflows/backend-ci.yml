name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Analyze with SonarQube
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=examen-backend
          -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
          -Dsonar.token=${{ env.SONAR_TOKEN }}

      - name: Verify Docker image build
        run: docker build --tag examen-backend:${{ github.sha }} .

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3

      - name: Rebuild application on the production server
        env:
          INSTANCE_ID: ${{ secrets.AWS_PROD_INSTANCE_ID }}
        run: |
          cat > ssm-commands.json <<'EOF'
          {"commands":[
            "set -euo pipefail",
            "cd /opt/examen/app",
            "git -C backend fetch origin main",
            "git -C backend checkout -B main origin/main",
            "git -C frontend fetch origin main",
            "git -C frontend checkout -B main origin/main",
            "docker compose -f compose.yml up -d --build --remove-orphans"
          ]}
          EOF

          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=InstanceIds,Values=${INSTANCE_ID}" \
            --parameters file://ssm-commands.json \
            --query 'Command.CommandId' --output text)

          for attempt in {1..60}; do
            status=$(aws ssm list-command-invocations --command-id "$command_id" --details --query 'CommandInvocations[0].Status' --output text)
            echo "SSM status: $status"
            [ "$status" = "Success" ] && exit 0
            [[ "$status" =~ ^(Failed|Cancelled|TimedOut)$ ]] && exit 1
            sleep 5
          done
          exit 1
